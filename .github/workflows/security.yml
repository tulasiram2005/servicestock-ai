name: Free security checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit bandit
      - run: pip-audit -r api/requirements.txt
      - run: bandit -r api/app -ll
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  containers:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t servicestock-api .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: servicestock-api
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          image: servicestock-api
          artifact-name: servicestock-sbom.spdx.json
  codeql:
    if: github.event.repository.private == false
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
