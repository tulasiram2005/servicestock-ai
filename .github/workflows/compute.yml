name: Free public-repository compute
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: nightly-compute
  cancel-in-progress: false
jobs:
  compute:
    if: github.event.repository.private == false && vars.FREE_COMPUTE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-compute.txt
      - run: pip install -r api/requirements-compute.txt
      - run: python -m app.analytics.benchmark && python -m app.analytics.compute
        working-directory: api
      - name: Publish compact results if configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            cd api
            python -c 'import os; from app.db.store import Store; from app.services import publish,retain; store=Store(os.environ["DATABASE_URL"]); publish(store,"../results"); retain(store,int(os.environ.get("RETENTION_DAYS","30")))'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: compact-results
          path: results/*.json
          retention-days: 3
