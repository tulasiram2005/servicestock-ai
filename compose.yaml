services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: servicestock
      POSTGRES_USER: servicestock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicestock -d servicestock"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./api
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      APP_ENV: local
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  postgres_data:
