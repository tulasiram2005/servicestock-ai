services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicestock
      POSTGRES_USER: servicestock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicestock -d servicestock"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./api
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DATABASE_URL: postgresql+psycopg://servicestock:${POSTGRES_PASSWORD}@db:5432/servicestock
      APP_ENV: local
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
